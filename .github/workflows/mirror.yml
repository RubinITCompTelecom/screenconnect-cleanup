# Copy to .github/workflows/mirror.yml in the SOURCE repo pupontech/screenconnect-cleanup (already set to push to
# RubinITCompTelecom/screenconnect-cleanup; for any other project change the repo name in the `if:` and the remote line).
# Needs the secret MIRROR_SSH_KEY (private deploy key; its public half has write access on the mirror repo).
# Mirrors EVERY branch and tag (checkout only makes the triggering branch local, so we push the origin/* refs).
name: Mirror to RubinITCompTelecom
on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

# one mirror run at a time, so an older run can never force-push stale refs over a newer one
concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    # the mirror repo receives this same file; do nothing there
    if: github.repository == 'pupontech/screenconnect-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to mirror repo
        env:
          KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote add mirror git@github.com:RubinITCompTelecom/screenconnect-cleanup.git
          for b in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$'); do
            git push mirror --force "refs/remotes/origin/$b:refs/heads/$b"
          done
          git push mirror --tags --force
